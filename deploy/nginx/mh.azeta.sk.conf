# Whisper API na mh.azeta.sk
#
# Inštalácia (ostatné stránky nginx sa nemenia):
#   sudo cp deploy/nginx/mh.azeta.sk.conf /etc/nginx/sites-available/whisper
#   sudo ln -s /etc/nginx/sites-available/whisper /etc/nginx/sites-enabled/whisper
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS rieši reverse proxy 10.0.10.22, ktorá sem posiela HTTP na port 80.
# Na nej treba pre mh.azeta.sk nastaviť aspoň:
#   client_max_body_size 200M;  proxy_read_timeout 1800s;  proxy_send_timeout 1800s;
#   proxy_request_buffering off;

# Limity na IP klienta (zóny musia byť v http kontexte – tento súbor sa includuje v http {}).
# Neplatné kľúče / skúšanie: 30 req/min; prepis je drahý: 6 req/min s malou rezervou.
limit_req_zone $binary_remote_addr zone=whisper_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=whisper_transcribe:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=whisper_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name mh.azeta.sk;

    # Skutočná IP klienta z reverse proxy (inak by všetci zdieľali limit IP 10.0.10.22)
    set_real_ip_from 10.0.10.22;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/whisper.access.log;
    error_log  /var/log/nginx/whisper.error.log warn;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn whisper_conn 4;

    # Musí sedieť s MAX_UPLOAD_MB v /opt/whisper/.env
    client_max_body_size 200M;
    client_body_timeout 300s;

    # Prepis na CPU môže trvať desiatky minút (REQUEST_TIMEOUT v .env)
    proxy_connect_timeout 10s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;

    location /v1/audio/ {
        limit_req zone=whisper_transcribe burst=5 nodelay;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    location /v1/ {
        limit_req zone=whisper_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    # Health check iba z lokálnej siete (monitoring), nie z internetu
    location = /health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        # požiadavky cez reverse proxy majú real_ip klienta z internetu → deny
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    # Všetko ostatné (/, /docs, skenery)
    location / {
        return 404;
    }
}
